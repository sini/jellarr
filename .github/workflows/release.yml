name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build package
        run: nix build .#default

      - name: Prepare release artifacts
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p release
          cp result/share/bundle.cjs release/jellarr-${VERSION}.cjs

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Without an explicit tag the draft gets a placeholder "untagged-…"
          # tag, and publishing it creates that tag on the target branch.
          tag_name: ${{ github.ref_name }}
          files: release/*.cjs
          body: |
            ## Jellarr ${{ github.ref_name }}

            ```bash
            # With Nix
            nix run github:${{ github.repository }}/${{ github.ref_name }}

            # With Docker
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}

            # Download bundle (requires Node.js 24+)
            node jellarr-${{ github.ref_name }}.cjs --configFile path/to/config.yml
            ```

            ## Changelog

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed release notes.
          # A tag creates a draft with the bundle attached; a maintainer writes
          # the notes and publishes it by hand.
          draft: true
          prerelease: false
