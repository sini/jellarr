name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: jellarr
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Install Node.js dependencies
        run: |
          nix develop --command pnpm install

      - name: Build project
        run: |
          nix develop --command pnpm build

      - name: Type check
        run: |
          nix develop --command pnpm typecheck

      - name: Lint
        run: |
          nix develop --command pnpm eslint

      - name: Run unit tests
        run: |
          nix develop --command pnpm test

      - name: Build Nix package
        run: |
          nix build .#

      - name: Evaluate every flake output
        run: |
          nix flake check --all-systems --no-build

      - name: Build non-VM checks
        run: |
          for c in formatting linting module-package-override module-bootstrap module-options module-types image-config; do
            nix build ".#checks.x86_64-linux.$c" --no-link --print-build-logs
          done

      # One VM at a time: parallel VMs starve each other on the runner. Keep
      # the sandbox on: outside it the build directory sits under the runner's
      # long work path, so QEMU's monitor socket path for the longer test names
      # passes the 108-byte UNIX socket limit and the VM never starts.
      - name: Run VM integration tests
        run: |
          failed=0
          for c in switch-apply sanity-jellyfin-10_11 sanity-jellyfin-12 library-update-jellyfin-10_11 library-update-jellyfin-12 gaps-jellyfin-10_11 gaps-jellyfin-12 locations-jellyfin-10_11 locations-jellyfin-12 authority-jellyfin-10_11 authority-jellyfin-12; do
            echo "::group::$c"
            nix build ".#checks.x86_64-linux.$c" --no-link --print-build-logs --max-jobs 1 || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
